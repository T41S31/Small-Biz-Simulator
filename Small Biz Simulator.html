<!DOCTYPE html>
<!-- 
    Small Biz Simulator Ver.01 
    Start 2026.09.23
 -->
<html lang="ja"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Small Biz Simulator</title>

        <link rel="stylesheet" href="Small%20Biz%20Simulator_files/style_T_tc.css">
    </head>
    <body>
        <header>
            <h1>Small Biz Simulator</h1>
        </header>

        <main>
            <section class="intro">
                <h2>あなたのお店は "いくら" 売れば黒字になる？</h2>
                <p>事業の数字を入力すると、黒字化に必要な売上や客数、様々な経営指標を計算できます！</p>
            </section>

            <section class="input-form"><!--入力フォーム-->
                <div class="form-row monthly-sales"><!--月間売上高-->
                    <label for="monthly-sales">月間売上高</label>
                    <input type="number" id="monthly-sales" name="monthly-sales" placeholder="1000000" value="0">
                    <span>円</span>
                </div>
                <div class="form-row monthly-fixed-cost"><!--月間固定費-->
                    <label for="monthly-fixed-cost">月間固定費</label>
                    <input type="number" id="monthly-fixed-cost" name="monthly-fixed-cost" placeholder="1000000">
                    <span>円</span>
                </div>
                <div class="form-row cost-of-sales-ratio"><!--原価率-->
                    <label for="cost-of-sales-ratio">原価率</label>
                    <input type="number" id="cost-of-sales-ratio" name="cost-of-sales-ratio" placeholder="1000000">
                    <span>円</span>
                </div>
                <div class="form-row monthly-variable-cost"><!--その他の月間変動費-->
                    <label for="monthly-variable-cost">その他の月間変動費</label>
                    <input type="number" id="monthly-variable-cost" name="monthly-variable-cost" placeholder="1000000">
                    <span>円</span>
                    <h5>※決済手数料・販売手数料・包装材など</h5>
                </div>
                <div class="form-row average-customer-spend"><!--客単価-->
                    <label for="average-customer-spend">客単価</label>
                    <input type="number" id="average-customer-spend" name="average-customer-spend" placeholder="1000">
                    <span>円</span>
                </div>
                <div class="form-row business-days"><!--営業日数-->
                    <label for="business-days">営業日数</label>
                    <select name="business-days" id="business-days">
                        <option value="" selected="selected">選択してください</option>
                        <option value="1">1日</option>
                        <option value="2">2日</option>
                        <option value="3">3日</option>
                        <option value="4">4日</option>
                        <option value="5">5日</option>
                        <option value="6">6日</option>
                        <option value="7">7日</option>
                        <option value="8">8日</option>
                        <option value="9">9日</option>
                        <option value="10">10日</option>
                        <option value="11">11日</option>
                        <option value="12">12日</option>
                        <option value="13">13日</option>
                        <option value="14">14日</option>
                        <option value="15">15日</option>
                        <option value="16">16日</option>
                        <option value="17">17日</option>
                        <option value="18">18日</option>
                        <option value="19">19日</option>
                        <option value="20">20日</option>
                        <option value="21">21日</option>
                        <option value="22">22日</option>
                        <option value="23">23日</option>
                        <option value="24">24日</option>
                        <option value="25">25日</option>
                        <option value="26">26日</option>
                        <option value="27">27日</option>
                        <option value="28">28日</option>
                        <option value="29">29日</option>
                        <option value="30">30日</option>
                        <option value="31">31日</option>
                    </select>
                </div>

            </section>

            <section class="result">
                <!--ここに計算結果を表示する-->
            </section>

            <section class="graph">
                <!--ここにグラフを表示する-->
            </section>
        </main>

        <footer>
            <p>Small Biz Simulator</p>
        </footer>

        <script src="Small%20Biz%20Simulator_files/script_T_tc.js"></script>
    

</body></html>
